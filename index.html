.btn{display:inline-block;background:var(--acc);color:#fff;border:0;padding:11px 22px;border-radius:999px;font:700 15px Cairo;cursor:pointer;text-decoration:none;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}

@media(max-width:720px){nav{display:none}}
.hero{position:relative;padding:72px 0 88px;overflow:hidden}
.hero h1{font-size:clamp(34px,7vw,64px);font-weight:900;line-height:1.2;max-width:640px}

.tag{font-family:Inter;font-weight:800;font-size:12px;letter-spacing:2px;color:var(--acc);margin-bottom:14px;direction:ltr;text-align:right}
.shapes{position:absolute;inset:0;pointer-events:none}
.sh{position:absolute;animation:fl 7s ease-in-out infinite}
.s1{width:120px;height:120px;border-radius:50%;background:var(--acc);left:8%;top:14%;opacity:.9}
.s2{width:150px;height:96px;border-radius:14px;background:var(--dark);left:22%;top:56%;transform:rotate(-12deg);animation-delay:-2s}
.s3{width:90px;height:90px;border:6px solid var(--acc);border-radius:22px;left:4%;top:62%;animation-delay:-4s}
.s4{width:70px;height:70px;background:var(--acc2);border-radius:50% 50% 50% 0;left:30%;top:10%;animation-delay:-1s}
@keyframes fl{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -22px;rotate:8deg}}
@media(max-width:720px){.shapes{opacity:.25}}
section{padding:64px 0}
h2{font-size:clamp(26px,4vw,38px);font-weight:900;margin-bottom:8px}
.sub{color:var(--mut);margin-bottom:32px;max-width:560px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.svc div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;transition:.25s;position:relative;overflow:hidden}
.svc div:hover{transform:translateY(-5px);border-color:var(--acc)}
.svc em{font:800 13px Inter;color:var(--acc);font-style:normal}
.svc h3{font-size:19px;margin:6px 0 4px}
.svc p{color:var(--mut);font-size:14px}
.svc div:first-child,.svc div:nth-child(4){background:var(--dark);color:var(--on-dark)}
.svc div:first-child p,.svc div:nth-child(4) p{color:#b8b3c4}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tabs button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font:600 14px Cairo;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.p{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.25s;animation:in .5s both}
.p:hover{transform:translateY(-6px) rotate(-.6deg)}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.p .im{aspect-ratio:4/3;background:var(--acc2);display:grid;place-items:center;font:800 34px Inter;color:var(--acc);background-size:cover;background-position:center}
.p .b{padding:14px 16px 18px}
.p h4{font-size:17px}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}

.tst{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tst div{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--card)}
.tst small{color:var(--mut)}
.cta{background:var(--acc);color:#fff;border-radius:28px;padding:48px 28px;text-align:center}
.cta .btn{background:#fff;color:#4c1d95;margin-top:16px}
footer{padding:40px 0;border-top:1px solid var(--line);margin-top:56px;color:var(--mut);font-size:14px}
footer .w{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}
#adm{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:20px}
#adm.on{display:block}
#adm .box2{max-width:720px;margin:auto}
#adm input,#adm select,#adm textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font:16px Cairo;background:var(--card);color:var(--ink);margin:4px 0 12px}
.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:var(--card)}
.row span{flex:1}
.x{background:#dc2626;color:#fff;border:0;border-radius:10px;padding:6px 12px;font:600 13px Cairo;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

nav a.on{color:var(--acc)}.bc{font-size:13px;color:var(--mut);padding:18px 0 0}.bc a{color:var(--acc);text-decoration:none}
.cart{position:relative}.cart i{position:absolute;top:-6px;left:-6px;background:var(--ink);color:var(--bg);border-radius:99px;font:700 11px Inter;padding:1px 6px;font-style:normal}
.fl{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:18px;z-index:30;background:#25d366;color:#fff;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 14px Inter;text-decoration:none;box-shadow:0 4px 14px #0003}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.bar input,.bar select,.f input,.f select,.f textarea{padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font:16px Cairo;background:var(--card);color:var(--ink)}.bar input{flex:1;min-width:180px}
.f{display:grid;gap:4px;max-width:560px}.f input,.f select,.f textarea{width:100%;margin-bottom:8px}.err{color:#dc2626;font-size:13px;min-height:18px}.ok{background:var(--acc2);padding:16px;border-radius:14px}
.mod{position:fixed;inset:0;background:#000a;z-index:60;display:none;place-items:center;padding:16px}.mod.on{display:grid}.mod>div{background:var(--bg);border-radius:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.dt{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}.big{aspect-ratio:1;border-radius:22px;background:var(--acc2);display:grid;place-items:center;font:800 64px Inter;color:var(--acc);background-size:cover;background-position:center}
.th{display:flex;gap:8px;margin-top:8px}.th button{width:64px;height:64px;border-radius:12px;border:2px solid var(--line);background:var(--acc2);cursor:pointer;background-size:cover}.th button.on{border-color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.chips button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:600 14px Cairo;cursor:pointer}.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.mas{columns:3 200px;gap:14px}.mas div{break-inside:avoid;margin-bottom:14px;border-radius:18px;display:grid;place-items:end start;padding:16px;font-weight:700;cursor:pointer;color:#fff;transition:.25s}.mas div:hover{transform:scale(1.02)}
.q{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}.q summary{padding:14px 18px;font-weight:700;cursor:pointer}.q p{padding:0 18px 14px;color:var(--mut)}
.ci{display:flex;gap:10px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}

</style>

<script>
const CATS={biz:["طباعة تجارية","Business Printing","كروت بيزنس|استيكرات|ليبلز|فلايرز|مطبوعات دعائية","للشركات والمحلات: مطبوعات تظهّر شغلك باحترافية."],
hand:["هاند ميد وبراندات","Handmade & Branding","استيكرات براند|استيكر لوجو|ليبل منتجات|كروت شكر|كروت توزيعات|تصميم تغليف","لأصحاب الهاند ميد والريزن: هوية تظهر على كل قطعة."],
event:["مناسبات ومطبوعات شخصية","Events & Personal","كروت دعوة|كروت توزيعات|استيكرات هدايا|مطبوعات شخصية","لمناسباتك: تفاصيل صغيرة بتفرق."],
school:["مطبوعات المدارس","School Printing","استيكرات أسماء|استيكرات أدوات مدرسية|استيكر واتر بروف|استيكرات أطفال مخصصة","ليبلز للأطفال والمدارس والأكاديميات."],
design:["خدمات التصميم","Design Services","تصميم جرافيك|تصميم كروت بيزنس|ملفات جاهزة للطباعة|تصميم مخصص","من الفكرة لملف جاهز للطباعة."]};
const DEF=[["كروت بيزنس","biz"],["استيكر لوجو دائري","hand"],["استيكر واتر بروف شفاف","school"],["ليبل أسماء الأطفال","school"],["كارت NFC + QR","biz"],["كروت توزيعات","event"],["تصميم لوجو وهوية","design"],["ليبل منتجات","hand"]].map((x,i)=>({id:"d"+i,n:x[0],c:x[1],d:"التفاصيل والخامات والمقاسات حسب طلبك.",p:"",s:"حسب الطلب",m:"حسب الطلب",t:i}));
let WORKS=[["استيكرات براند","hand"],["كروت بيزنس","biz"],["ليبلز مدرسية","school"],["كروت مناسبة","event"],["فينيل مرايا","biz"],["كارت NFC","biz"]];
const FAQ=[["إزاي أطلب؟","ضيف المنتجات لقائمة الطلب أو املا نموذج عرض السعر، وهنكمل معاك على واتساب."],["الأسعار ثابتة؟","الأسعار بتختلف حسب المقاس والكمية والخامة، فبنديك عرض سعر."],["أرسل تصميمي؟","أكيد، ابعت الملف على واتساب أو اطلب منا تصميمه."],["بتطبعوا إيه؟","فينيل، استنسل، صور، استيكر واتر بروف، مطبوعات ورقية، ليبلز مدارس، وكروت NFC."]];
let WA="201003757434",items=DEF,all=DEF,S={},rw=false,cart=[],db=null,asset=null,isAdm=false,gi=0;
try{cart=JSON.parse(localStorage.getItem("fpc")||"[]")}catch(e){}
const $=i=>document.getElementById(i),esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wl=t=>"https://wa.me/"+WA+"?text="+encodeURIComponent(t);
const sv=()=>{try{localStorage.setItem("fpc",JSON.stringify(cart))}catch(e){}};
const opts=s=>String(s||"").split(/[,،]/).map(x=>x.trim()).filter(Boolean);
const pc=i=>i.p&&i.pm!="quote"?esc(i.p):"اطلب عرض سعر";
const img=i=>i.img?`style="background-image:url(${esc(i.img)})"`:"";
const card=i=>`<div class="p"><div class="im" ${img(i)}>${i.img?"":"FP"}</div><div class="b"><small>${CATS[i.c]?CATS[i.c][0]:esc(i.c)}</small><h4>${esc(i.n)}</h4><div class="pr">${pc(i)}</div><small>${esc(i.d)}</small><br><a href="#product-${i.id}">التفاصيل</a> · <a href="#" data-q="${i.id}">نظرة سريعة</a></div></div>`;
const hero=(t,s)=>`<div class="w" style="padding-top:28px"><h2>${t}</h2><p class="sub">${s}</p></div>`;
const V={
home(){return `<div class="hero"><div class="shapes"><i class="sh s1"></i><i class="sh s2"></i><i class="sh s3"></i><i class="sh s4"></i></div><div class="w" style="position:relative"><div class="tag">WE PRINT YOUR IDEAS INTO REALITY</div><h1>${S.ht?esc(S.ht):"بنطبع <span>فكرتك</span> وتبقى حقيقة في إيدك"}</h1><p>${S.hs?esc(S.hs):"تصميم وطباعة لأصحاب المشاريع والهاند ميد والمدارس والمناسبات."}</p><a class="btn" href="#products">شوف المنتجات</a> <a class="btn o" href="#contact">اطلب عرض سعر</a></div></div>
<section><div class="w"><h2>اختار اللي يناسبك</h2><p class="sub">رسالة مختلفة لكل فئة.</p><div class="svc">`+[["مشروع ناشئ","ابدأ بهوية مطبوعة تخليك مميز من أول طلب.","biz"],["هاند ميد","ليبل واستيكر يخلي منتجك اليدوي شكله براند.","hand"],["براند","ثبّت هويتك على كل تغليف وكارت.","hand"],["مدرسة أو أكاديمية","ليبلز وأسماء مقاومة للمية للطلاب.","school"],["أفراد","مطبوعات لمناسباتك وهداياك.","event"]].map(a=>`<div><em>${a[0]}</em><h3>${a[1]}</h3><a href="#service-${a[2]}" style="color:var(--acc);font-weight:700;text-decoration:none">شوف الخدمات ←</a></div>`).join("")+`</div></div></section>
<section><div class="w"><h2>منتجات مختارة</h2><p class="sub">&nbsp;</p><div class="grid">${items.filter(i=>i.f).concat(items).filter((v,k,a)=>a.indexOf(v)==k).slice(0,4).map(card).join("")}</div></div></section>
<section><div class="w"><div class="cta"><h2>جاهز نطبع فكرتك؟</h2><p>ابعتلنا التفاصيل ونرد بعرض سعر.</p><a class="btn" href="#contact">اطلب عرض سعر</a></div></div></section>`},
about(){return hero("من نحن","Foush Print مشروع تصميم وطباعة مصري لأصحاب المشاريع والأفراد.")+`<div class="w"><p>بنقدم التصميم والطباعة والتجهيز والقص والتشطيب حسب نوع المنتج والخامة، وبنكمل معاك الطلب على واتساب.</p></div>`},
services(){return hero("الخدمات","خمس تصنيفات تغطي احتياجك.")+`<div class="w"><div class="svc">${Object.entries(CATS).map(([k,c],i)=>`<div><em>0${i+1} · ${c[1]}</em><h3>${c[0]}</h3><p>${c[3]}</p><a href="#service-${k}" style="color:var(--acc);font-weight:700;text-decoration:none">التفاصيل ←</a></div>`).join("")}</div></div>`},
service(k){const c=CATS[k];if(!c)return V.nf();return hero(c[0],c[3])+`<div class="w"><div class="chips">${c[2].split("|").filter(Boolean).map(x=>`<button data-sv="${x}">${x}</button>`).join("")}</div><div class="grid">${items.filter(i=>i.c==k).map(card).join("")||"<p class='sub'>لا توجد منتجات في هذا القسم بعد.</p>"}</div><br><a class="btn" href="#contact" data-svc="${k}">اطلب عرض سعر</a></div>`},
products(){return hero("المنتجات","ابحث وفلتر وقارن.")+`<div class="w"><div class="bar"><input id="sq" placeholder="ابحث عن منتج"><select id="sc"><option value="">كل التصنيفات</option>${Object.entries(CATS).map(([k,c])=>`<option value="${k}">${c[0]}</option>`).join("")}</select><select id="ss"><option value="t">الأحدث</option><option value="n">الاسم</option></select></div><div class="grid" id="pg"></div></div>`},
product(id){const i=items.find(x=>x.id==id);if(!i)return V.nf();gi=0;const S=opts(i.s),M=opts(i.m);return `<div class="w" style="padding:28px 20px"><div class="dt"><div><div class="big" id="bigi" ${img(i)}>${i.img?"":"FP"}</div>${(i.imgs||[]).length>1?`<div class="th">${i.imgs.map(u=>`<button data-gi="${esc(u)}" style="background-image:url(${esc(u)})"></button>`).join("")}</div>`:""}</div><div><small>${CATS[i.c]?CATS[i.c][0]:""}</small><h2>${esc(i.n)}</h2><p class="sub">${esc(i.d)}</p><div class="pr" style="font-weight:800;color:var(--acc);font-size:20px">${pc(i)}</div><div class="f" id="of" data-id="${i.id}"><label>المقاس</label><select id="os">${(S.length?S:["حسب الطلب"]).map(x=>`<option>${esc(x)}</option>`).join("")}</select><label>الخامة</label><select id="om">${(M.length?M:["حسب الطلب"]).map(x=>`<option>${esc(x)}</option>`).join("")}</select><label>الكمية</label><input id="oq" type="number" min="1" value="50"><label>ملاحظات</label><textarea id="on" rows="2"></textarea><div class="err" id="oe"></div></div><button class="btn" data-add="${i.id}">أضف لقائمة الطلب</button> <a class="btn o" id="owa" target="_blank" data-wa="${i.id}" href="#">اطلب عبر واتساب</a></div></div></div>`},

function csv(t){const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";R.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);R.push(r)}const HA={"الاسم":"name","اسم المنتج":"name","التصنيف":"category","القسم":"category","الوصف":"description","السعر":"price","المقاسات":"sizes","الخامات":"materials","الصور":"images","الصورة":"images","مميز":"featured","ظاهر":"visible","الترتيب":"order"};const hd=(R.shift()||[]).map(x=>{x=x.replace(/^\uFEFF/,"").trim().toLowerCase();return HA[x]||x});return R.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(hd.map((k,i)=>[k,(x[i]||"").trim()])))}

function iu(s){s=s.trim();if(!s)return"";const m=s.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);if(m)return"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1200";return/^https?:/.test(s)?s:"images/"+s}
const NO=/^(no|لا|false|0|hidden|مخفي)$/i,YES=/^(yes|نعم|1|true|y)$/i;
function mapP(rows){return rows.filter(r=>r.name&&!NO.test(r.visible||"")).map((r,k)=>{const imgs=(r.images||"").split(/[|\n]/).map(iu).filter(Boolean);return{id:/^[\w-]+$/.test(r.id||"")?r.id:"p"+k,n:r.name,c:ck(r.category),d:r.description||"",p:r.price||"",pm:r.price?"fixed":"quote",s:r.sizes||"",m:r.materials||"",f:YES.test(r.featured||""),o:+r.order||0,t:k,imgs,img:imgs[0]||""}}).sort((a,b)=>(a.o||999)-(b.o||999)||a.t-b.t)}
